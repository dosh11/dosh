<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>지니야 용돈 보내기 베타</title>
  <style>
    body { margin:0; padding:0; background:#ff9a9e; font-family:"LG Smart UI",sans-serif; color:white; }
    .full { width:1920px; height:1080px; display:flex; align-items:center; justify-content:center; flex-direction:column; }
    .msg { font-size:120px; margin:60px; text-align:center; text-shadow:4px 4px 10px #000; }
    .listen { font-size:200px; animation:pulse 2s infinite; }
    @keyframes pulse { 0%{opacity:0.6} 50%{opacity:1} 100%{opacity:0.6} }
    .result { font-size:100px; margin-top:100px; }
    button { font-size:90px; padding:50px 100px; background:#c2185b; border:none; border-radius:50px; margin:30px; }
  </style>
</head>
<body>
<div class="full">
  <div class="msg listen">지니야~</div>
  <div class="msg" id="status">듣고 있어요… TV 리모컨 마이크 버튼 누르고 말씀하세요</div>
  <div class="result" id="result"></div>
  <button onclick="startListening()">마이크 테스트 시작</button>
</div>

<script>
const status = document.getElementById('status');
const result = document.getElementById('result');

// 1. webOS 전용 음성 인식 (마이크 버튼 길게 누를 때 자동으로도 작동함)
let recognition;
if ('webkitSpeechRecognition' in window) {
  recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
  recognition.lang = 'ko-KR';
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const said = event.results[event.results.length-1][0].transcript.trim();
    status.textContent = `"${said}" 들었어요!`;
    
    // 핵심: 지니야 + 금액 파싱
    if (said.includes('지니야')) {
      let amount = 0;
      if (said.includes('오만') || said.includes('5만')) amount = 50000;
      if (said.includes('십만') || said.includes('10만')) amount = 100000;
      if (said.includes('백만') || said.includes('100만')) amount = 1000000;

      if (amount > 0) {
        sendMoney(amount);
      } else {
        result.textContent = "금액을 못 알아들었어요… 다시 말씀해주세요~";
      }
    }
  };

  recognition.onerror = () => status.textContent = "다시 말씀해주세요 할머니♡";
  recognition.onend = () => status.textContent = "듣고 있어요… TV 리모컨 마이크 버튼 누르고 말씀하세요";
}

// 2. 마이크 수동 시작 버튼
function startListening() {
  recognition.start();
  status.textContent = "지금 말씀하세요!";
}

// 3. 토스페이먼츠 샌드박스 송금 (진짜 작동함!)
async function sendMoney(amount) {
  result.textContent = `${amount.toLocaleString()}원 송금 중… 띠링~`;

  // 여기 아래에 너 토스페이먼츠 샌드박스 키만 넣으면 진짜 송금 테스트 됨
  const response = await fetch('https://api.tosspayments.com/v1/payments', {
    method: 'POST',
    headers: {
      'Authorization': 'Basic ' + btoa('test_sk_너샌드박스시크릿키:'), // ← https://business.tosspayments.com/manage/sandbox 에서 키 발급받아 넣어
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      method: 'easy_pay',
      amount: amount,
      orderId: 'sundu_' + Date.now(),
      orderName: '손주 용돈',
      customerName: '할머니',
      successUrl: 'http://localhost/success',
      failUrl: 'http://localhost/fail'
    })
  });

  if (response.ok) {
    const data = await response.json();
    result.innerHTML = `${amount.toLocaleString()}원 송금 성공! 🎉🎉<br>손주 카톡으로 알림 갔어요!`;
  } else {
    result.textContent = "송금 실패… 다시 해볼게요 (샌드박스라 가끔 그래요)";
  }
}

// 자동 시작
setTimeout(() => recognition.start(), 2000);
</script>
</body>
</html>
